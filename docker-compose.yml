services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-daemon
    restart: unless-stopped
    command: ["python", "scripts/run_daily_bot.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    env_file:
      - path: .env
        required: false

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-dashboard
    restart: unless-stopped
    command: ["uvicorn", "src.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # Securely bind only to localhost to prevent public internet exposure
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    env_file:
      - path: .env
        required: false
