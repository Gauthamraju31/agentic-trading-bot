services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1001
        GROUP_ID: 1001
    container_name: trading-bot-daemon
    restart: unless-stopped
    command: ["python", "scripts/run_daily_bot.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
      - ./scripts:/app/scripts
      # Mount host agy CLI binary and authentication data
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
      - ~/.gemini:/home/trader/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HOME=/home/trader
    env_file:
      - path: .env
        required: false

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1001
        GROUP_ID: 1001
    container_name: trading-bot-dashboard
    restart: unless-stopped
    command: ["uvicorn", "src.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # Securely bind only to localhost to prevent public internet exposure
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
      - ./scripts:/app/scripts
      # Mount host agy CLI binary and authentication data
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
      - ~/.gemini:/home/trader/.gemini
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - HOME=/home/trader
    env_file:
      - path: .env
        required: false
