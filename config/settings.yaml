app:
  name: TradingBot
  mode: mock
  log_level: INFO
  data_dir: data
market:
  exchange: NSE
  symbols:
  - RELIANCE
  - TCS
  - INFY
  - HDFCBANK
  - ICICIBANK
  - SBIN
  - BAJFINANCE
  - ITC
  - KOTAKBANK
  - LT
  indices:
  - NIFTY 50
  - NIFTY BANK
  timeframe: 5m
  trading_hours:
    start: 09:15
    end: '15:30'
    pre_open_start: 09:00
    timezone: Asia/Kolkata
mock:
  initial_capital: 100000
  slippage_pct: 0.05
  brokerage_per_order: 20
risk:
  max_position_pct: 30.0
  max_daily_loss_pct: 2.0
  max_open_positions: 3
  default_stop_loss_pct: 2.0
  risk_per_trade_pct: 1.0
  position_sizing: fixed_fractional
  trailing_stop_atr_multiplier: 2.0
fees:
  brokerage_per_order: 20
  stt_delivery_pct: 0.1
  stt_intraday_sell_pct: 0.025
  exchange_charges_pct: 0.00297
  gst_pct: 18.0
  sebi_charges_pct: 0.0001
  stamp_duty_delivery_buy_pct: 0.015
  stamp_duty_intraday_buy_pct: 0.003
agents:
  llm_provider: agy
  model_name: gemini-2.5-flash
  agy_model: ''
  agy_effort: low
  agy_effort_per_role:
    technical_analyst: low
    sentiment_analyst: low
    bull: medium
    bear: medium
    risk_manager: low
    portfolio_manager: high
    market_selector: low
  llm_timeout_secs: 120
  temperature: 0.3
  debate_rounds: 2
  min_confidence: 0.6
  max_retries: 3
  max_rpd: 1000
  max_rpm: 30
backtest:
  start_date: '2024-01-01'
  end_date: '2025-12-31'
  walk_forward:
    in_sample_days: 180
    out_sample_days: 30
  benchmark: NIFTY 50
  initial_capital: 1000000
learning:
  reflection_memory_file: data/trade_reflection_memory.md
  max_reflections_in_prompt: 5
  alpha_benchmark: NIFTY 50
vix:
  enabled: true
  high_vix_threshold: 18.0
  halt_vix_threshold: 25.0
  ticker: ^INDIAVIX
daily_goal:
  target_profit: 1500.0
  max_loss: 1000.0
  auto_stop_on_target: true
  pre_market_start: 09:00
  market_open: 09:15
  market_close: '15:30'
dashboard:
  host: 0.0.0.0
  port: 8080
  auto_refresh_seconds: 5
alerts:
  telegram_enabled: false
  telegram_bot_token: ''
  telegram_chat_id: ''
  email_enabled: false
  email_smtp_host: ''
  email_to: ''
